title = "按投稿平台查找"
intro = "仓库说明里明确提到针对的平台（按星数排序）。"
icon  = "📚"

[facet.values]
qidian   = "起点"
fanqie   = "番茄"
jjwxc    = "晋江"
zhihu    = "知乎盐言"
qimao    = "七猫"
royalroad = "Royal Road"
kdp      = "Kindle / KDP"

[discover]
