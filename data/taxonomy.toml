queries = [
  "小说 skill", "网文 skill", "写小说 skill", "长篇 skill", "短篇 skill", "番茄 skill",
  "拆书 skill", "去AI味 skill", "同人 skill", "互动小说 skill",
  "novel skill", "fiction skill", "web novel skill", "creative writing skill",
  "story writing skill", "humanizer skill",
  "小说下载", "番茄小说下载", "novel downloader", "书源", "番茄 发布", "短剧 skill", "剧本 skill",
